name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Check public release contents
        run: python scripts/check_public_release.py

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          bridge_core.py conversation_catalog.py desktop_assignment.py
          desktop_sessions.py project_context.py server.py

      - name: Validate shell scripts
        run: |
          sh -n scripts/bootstrap.sh
          sh -n scripts/run_server.sh

      - name: Run tests
        run: python -m unittest discover -s tests -v
